name = "agentlair-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "1e3b03e4a8d2514f89998dbdda7d5140"

# Binary imports for font files and pre-rendered OG images (used by OG image generation)
[[rules]]
type = "Data"
globs = ["**/*.woff2", "**/*.png"]
fallthrough = true

[[kv_namespaces]]
binding = "KEYS"
id = "e7125ab59c3e44e68e9b6496d47ac83d"

[[kv_namespaces]]
binding = "EMAILS"
id = "0c16b7fe8a09430fb3e7c21c70f9544f"

[[kv_namespaces]]
binding = "VAULT"
id = "5eb916dd7125415da51c15cd85c3b761"

[[kv_namespaces]]
binding = "A2A_LEADERBOARD"
id = "0d8118945ba44294a5a6e76b1ef6122a"

[[kv_namespaces]]
binding = "TRUST_VERIFY_CACHE"
id = "27d362b566ad4ea9986277a309388d5a"
preview_id = "c6c161e1797e419f9a774c11b7ab9590"

# Secrets (set via wrangler secret put — NOT stored here):
#   PLATFORM_ENCRYPTION_KEY  — base64-encoded 32-byte AES-256 key for email body encryption at rest
#                              Generate: openssl rand -base64 32
#                              Set:      wrangler secret put PLATFORM_ENCRYPTION_KEY
#   RESEND_API_KEY           — Resend API key for outbound email delivery
#   ADMIN_KEY                — Admin API key for privileged operations (tier overrides, etc.)
#                              Generate: openssl rand -hex 32
#                              Set:      wrangler secret put ADMIN_KEY
#
# Stripe Checkout (activate paid subscriptions):
#   1. Create Stripe account at dashboard.stripe.com
#   2. Create products: Starter ($29/mo) and Pro ($149/mo)
#   3. Set secrets:
#   STRIPE_SECRET_KEY        — Stripe secret key (sk_live_... or sk_test_... for testing)
#                              Set:      wrangler secret put STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET    — Stripe webhook signing secret (whsec_...)
#                              From:     Stripe Dashboard → Webhooks → Signing secret
#                              Register: POST https://agentlair.dev/v1/stripe/webhook (checkout.session.completed)
#                              Set:      wrangler secret put STRIPE_WEBHOOK_SECRET

[[analytics_engine_datasets]]
binding = "AE_ANALYTICS"
dataset = "agentlair_events"

[[durable_objects.bindings]]
name = "INBOX_NOTIFIER"
class_name = "InboxNotifier"

[[durable_objects.bindings]]
name = "TRANSPARENCY_SERVICE"
class_name = "TransparencyService"

# DEPLOYED 2026-03-18: This DO migration was applied — InboxNotifier namespace now
# exists permanently on Cloudflare. Changed new_classes → new_sqlite_classes at deploy
# time (CF free plan requires new_sqlite_classes; InboxNotifier uses no storage so
# functionally identical).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxNotifier"]

# SCITT Transparency Service — serialized Merkle tree for Receipt issuance.
# Fixes the per-isolate hash chain bug by serializing all writes through a single DO.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["TransparencyService"]

# Audit trail D1 database
# Note: database_id is a placeholder — the deploy task will create the actual D1 database
# and update this ID via: wrangler d1 create agentlair-audit
[[d1_databases]]
binding = "AUDIT"
database_name = "agentlair-audit"
database_id = "7e358e12-9c65-4803-9d1d-298fec510099"

# Cron triggers
# Daily PoPA emission at 00:00 UTC (one attestation per enabled subscriber per day).
# IMPORTANT: wrangler.toml [triggers] may not register cron via the deploy script alone.
# Deploy stage MUST verify via GET /accounts/{id}/workers/scripts/agentlair-api/schedules
# and PUT it explicitly if absent (per agentlair-pipeline.md napkin entry 2026-04-24).
[triggers]
crons = ["0 0 * * *", "0 4 * * *"]
